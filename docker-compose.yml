services:
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: uas-reverse-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - static-web
      - dynamic-app
    networks:
      - uas-network
    restart: unless-stopped

  static-web:
    image: ${STATIC_IMAGE:-cevv/static-web:latest}
    build:
      context: ./static-web
    container_name: uas-static-web
    networks:
      - uas-network
    restart: unless-stopped

  dynamic-app:
    image: ${DYNAMIC_IMAGE:-cevv/dynamic-app:latest}
    build:
      context: ./dynamic-app
    container_name: uas-dynamic-app
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-uas_db}
      DB_USER: ${DB_USER:-uas_user}
      DB_PASSWORD: ${DB_PASSWORD:-uas_password}
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - uas-network
    restart: unless-stopped

  mariadb:
    image: mariadb:11.4
    container_name: uas-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_password_change_me}
      MARIADB_DATABASE: ${DB_NAME:-uas_db}
      MARIADB_USER: ${DB_USER:-uas_user}
      MARIADB_PASSWORD: ${DB_PASSWORD:-uas_password}
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - uas-network
    restart: unless-stopped

networks:
  uas-network:
    driver: bridge

volumes:
  mariadb-data:
